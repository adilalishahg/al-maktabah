services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: al_maktabah_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - MONGODB_URI=mongodb://mongo:27017/al_maktabah
      - ADMIN_EMAIL=admin@almaktabah.org
      - ADMIN_PASSWORD=maktabah1445
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - maktabah_network

  mongo:
    image: mongo:7.0-jammy
    container_name: al_maktabah_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - maktabah_network

volumes:
  mongodb_data:
    driver: local

networks:
  maktabah_network:
    driver: bridge

