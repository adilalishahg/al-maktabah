name: Al-Maktabah Continuous Integration & Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Cloud-Native Dependencies
        run: npm ci

      - name: 'Quality Gate 1: Strict TypeScript Type Check'
        run: npm run lint

      - name: 'Quality Gate 2: Automated Architecture & Security Test Suite'
        run: npm test

      - name: 'Quality Gate 3: Next.js Production Compilation'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

